services:
  - type: web
    name: graphshield
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: USE_CLOUD_SQL
        value: "false"
      - key: DEBUG
        value: "true"