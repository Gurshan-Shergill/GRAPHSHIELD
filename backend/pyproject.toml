[project]
name = " graphshield-backend\
version = \3.0.0\
description = \GraphShield - AI-Powered Image and Graph Plagiarism Detection Backend\
readme = \../README.md\
requires-python = \>=3.11\
license = {text = \MIT\}
authors = [{name = \Gurshan Shergill\, email = \gurshan@example.com\}]
keywords = [\plagiarism\, \detection\, \academic\, \figures\, \graphs\, \AI\, \computer-vision\]
classifiers = [
 \Development Status :: 4 - Beta\,
 \Intended Audience :: Education\,
 \Intended Audience :: Science/Research\,
 \License :: OSI Approved :: MIT License\,
 \Programming Language :: Python :: 3.11\,
 \Topic :: Scientific/Engineering :: Artificial Intelligence\,
 \Topic :: Text Processing :: Linguistic\,
]
dependencies = [
 \fastapi>=0.110.0\,
 \uvicorn[standard]>=0.28.0\,
 \pydantic>=2.7.0\,
 \pydantic-settings>=2.3.0\,
 \pydantic-extra-types>=2.6.0\,
 \python-multipart>=0.0.6\,
 \python-dotenv>=1.0.0\,
 \sqlalchemy>=2.0.0\,
 \asyncpg>=0.29.0\,
 \alembic>=1.13.0\,
 \pgvector>=0.2.0\,
 \celery>=5.3.0\,
 \redis>=5.0.0\,
 \minio>=7.2.0\,
 \pymupdf>=1.23.0\,
 \pillow>=10.2.0\,
 \imagehash>=4.3.1\,
 \opencv-python>=4.9.0\,
 \opencv-contrib-python>=4.9.0\,
 \numpy>=1.26.0\,
 \scipy>=1.11.0\,
 \scikit-image>=0.22.0\,
 \scikit-learn>=1.3.0\,
 \sentence-transformers>=3.0.0\,
 \transformers>=4.35.0\,
 \torch>=2.1.0\,
 \open-clip-torch>=2.24.0\,
 \easyocr>=1.7.0\,
 \pytesseract>=0.3.10\,
 \reportlab>=4.0.0\,
 \weasyprint>=60.0\,
 \jinja2>=3.1.0\,
 \slowapi>=0.1.9\,
 \python-jose[cryptography]>=3.3.0\,
 \passlib[bcrypt]>=1.7.4\,
 \httpx>=0.27.0\,
 \beautifulsoup4>=4.12.0\,
 \lxml>=4.9.0\,
 \structlog>=24.0.0\,
 \python-json-logger>=2.0.0\,
 \email-validator>=2.1.0\,
]

[project.optional-dependencies]
dev = [
 \pytest>=8.0.0\,
 \pytest-asyncio>=0.23.0\,
 \pytest-cov>=4.1.0\,
 \pytest-mock>=3.12.0\,
 \httpx>=0.27.0\,
 \ruff>=0.4.0\,
 \mypy>=1.8.0\,
 \types-python-jose>=3.3.0\,
 \types-passlib>=1.7.0\,
 \types-requests>=2.31.0\,
 \pre-commit>=3.6.0\,
]
docs = [
 \mkdocs>=1.5.0\,
 \mkdocs-material>=9.4.0\,
 \mkdocstrings[python]>=0.24.0\,
]

[tool.poetry]
name = \graphshield-backend\
version = \3.0.0\

[tool.poetry.group.dev.dependencies]
pytest = \^8.0\
pytest-asyncio = \^0.23\
pytest-cov = \^4.1\
pytest-mock = \^3.12\
httpx = \^0.27\
ruff = \^0.4\
mypy = \^1.8\
pre-commit = \^3.6\

[build-system]
requires = [\poetry-core>=1.0.0\]
build-backend = \poetry.core.masonry.api\

[tool.ruff]
line-length = 100
target-version = \py311\
select = [\E\, \F\, \I\, \UP\, \W\, \C4\, \C90\, \ANN\, \T20\, \PT\, \PTH\, \ERA\, \SIM\, \RET\, \ARG\, \FLY\]
ignore = [\ANN101\, \ANN102\, \ANN201\, \ANN202\, \ANN204\, \ANN401\, \ARG001\, \ARG002\, \T201\, \T203\, \PTH118\, \PTH123\, \SIM102\, \SIM103\, \SIM115\, \RET504\, \ERA001\]
exclude = [\migrations\, \.venv\, \__pycache__\, \*.pyc\]

[tool.ruff.format]
quote-style = \double\
indent-style = \space\
skip-magic-trailing-comma = false
line-ending = \lf\

[tool.mypy]
python_version = \3.11\
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [\migrations\, \.venv\]

[tool.pytest.ini_options]
asyncio_mode = \auto\
testpaths = [\tests\]
python_files = [\test_*.py\]
python_classes = [\Test*\]
python_functions = [\test_*\]
addopts = \-v --tb=short\
